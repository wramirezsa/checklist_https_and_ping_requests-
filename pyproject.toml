[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checklist-https-and-ping"
version = "0.1.0"
description = "Before-and-after checks for change windows: ping, HTTPS and TCP against a list of services, with a comparison report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wilson Ramírez" }]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
keywords = ["ping", "https", "monitoring", "change-management", "maintenance-window"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
svccheck = "svccheck.cli:main"

[tool.setuptools]
packages = ["svccheck"]
